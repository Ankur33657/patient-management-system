services:
  db:
    container_name: patient-service
    image: postgres:14.22-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: patient-service
      PGDATA: /data/postgres
    volumes:
      - patient-service:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  patient-service: